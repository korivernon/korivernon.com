<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- candlestick 1: down move -->
  <line x1="28" y1="30" x2="28" y2="72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <rect x="22" y="42" width="12" height="20" rx="2.5" fill="#ffffff" opacity="0.55"/>
  <!-- candlestick 2: up move (tallest, full opacity - the focal point) -->
  <line x1="50" y1="16" x2="50" y2="66" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="43" y="26" width="14" height="34" rx="3" fill="#ffffff"/>
  <!-- candlestick 3: modest up move -->
  <line x1="72" y1="34" x2="72" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <rect x="66" y="46" width="12" height="22" rx="2.5" fill="#ffffff" opacity="0.75"/>
</svg>
