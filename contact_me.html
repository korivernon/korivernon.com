<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Kori S. Vernon</title>
  <meta name="description" content="Get in touch with Kori S. Vernon: email, contact card, or the contact form.">
  <meta property="og:title" content="Contact · Kori S. Vernon">
  <meta property="og:image" content="https://korivernon.com/images/korivernon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>try { var t = localStorage.getItem('ksv:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <style>
    .contact-email { text-align: center; margin: 0 0 8px; }
    .contact-email .addr { font: 600 18px var(--mono); color: var(--text); user-select: all; }
    .contact-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0 0; }
    .page .contact-actions .btn { color: var(--text); }
    .contact-form { max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
    .contact-form .field { margin-bottom: 14px; }
    .contact-form label { display: block; font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 6px; }
    .contact-form input, .contact-form textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
    .contact-form textarea { resize: vertical; min-height: 130px; }
    .contact-form input:focus, .contact-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .contact-form .submit { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .contact-form .submit[disabled] { opacity: .6; cursor: progress; }
    .page .form-status { margin: 12px 0 0; font-size: 15px; }
    .form-status:empty { display: none; }
    .page .form-status.ok { color: var(--accent); }
    .page .form-status.err { color: var(--text); }
  </style>
</head>
<body>
  <div id="site-header" class="nav"></div>

  <main id="main" class="wrap page">
    <header class="page-head">
      <h1 class="sec-title">Contact Me</h1>
      <div class="heading-line"></div>
      <p class="lede">Add my contact card, email me, or fill out the form below.</p>
    </header>

    <p class="contact-email">Email: <span class="addr">me@korivernon.com</span></p>
    <div class="contact-actions">
      <a class="btn" href="mailto:me@korivernon.com">Send an email</a>
      <a class="btn" href="documents/Kori_Selwyn_Vernon.vcf" download>Add Contact Card</a>
    </div>

    <h2>Contact Form</h2>
    <div class="heading-line"></div>

    <form class="contact-form" name="submit-to-google-sheet" action="https://script.google.com/macros/s/AKfycbwPorCGm4fx5nCen62VcxGlkpGChDZd1vN5gH4CRpAAsSOlBnS5/exec" method="post">
      <div class="field">
        <label for="cf-name">Name</label>
        <input id="cf-name" name="name" type="text" placeholder="Enter name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="cf-email">Email</label>
        <input id="cf-email" name="email" type="email" placeholder="Enter email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" placeholder="Enter message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn submit">Send</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <div id="site-footer"></div>

  <script>
    (function () {
      var form = document.forms['submit-to-google-sheet'];
      var status = form.querySelector('.form-status');
      var button = form.querySelector('button[type="submit"]');

      function show(msg, ok) {
        status.textContent = msg;
        status.className = 'form-status ' + (ok ? 'ok' : 'err');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        button.disabled = true;
        button.textContent = 'Sending…';
        show('', true);
        fetch(form.action, { method: 'POST', body: new FormData(form) })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json().catch(function () { return { result: 'success' }; });
          })
          .then(function (data) {
            if (data && data.result === 'error') throw new Error('script error');
            form.reset();
            show('Thanks! Your message was sent. I’ll get back to you soon.', true);
          })
          .catch(function () {
            show('Sorry, your message could not be sent. Please try again or email me@korivernon.com directly.', false);
          })
          .then(function () {
            button.disabled = false;
            button.textContent = 'Send';
          });
      });
    })();
  </script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/page.js"></script>
</body>
</html>
